# SIV Engineering Website + CRM - Nginx Config
# Domain: clipe233eng.net
# App runs on port 3080

server {
    listen 80;
    server_name sivengineering.com www.sivengineering.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sivengineering.com www.sivengineering.com;

    # SSL Certificate (Webuzo/Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/sivengineering.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sivengineering.com/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Next.js App (running on port 3080)
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Cache static assets
    location /_next/static {
        alias /home/sivcrm/app/.next/standalone/.next/static;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Cache public files (images, etc)
    location /workshop.jpg {
        alias /home/sivcrm/app/.next/standalone/public/workshop.jpg;
        expires 30d;
        access_log off;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
    }
}
